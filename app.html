<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BESSMIND — Live demo</title>
  <meta name="description" content="Try the BESSMIND demo: paste a project email and see what changed and what it means for a battery storage project. Fictional sample data.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
  <link rel="stylesheet" href="app.css">
  <script src="i18n-de.js"></script>
  <script src="i18n.js"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="logo" viewBox="0 0 32 32"><rect x="2" y="5" width="25" height="22" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><rect x="28" y="13" width="3" height="6" rx="1.5" fill="currentColor"/><path d="M8 23V17M13 23V12M18 23V15M23 23V10" stroke="#2de2a6" stroke-width="2" stroke-linecap="round"/><polyline points="8,17 13,12 18,15 23,10" fill="none" stroke="#34c9ee" stroke-width="1.4"/><g fill="#34c9ee"><circle cx="8" cy="17" r="1.7"/><circle cx="13" cy="12" r="1.7"/><circle cx="18" cy="15" r="1.7"/><circle cx="23" cy="10" r="1.7"/></g></symbol></svg>

<div class="shell">
  <header class="top">
    <a class="brand" href="index.html" target="_top"><svg class="logo"><use href="#logo"/></svg><span>BESS<em>MIND</em></span></a>
    <nav id="nav">
      <button data-view="portfolio" class="on">Portfolio</button>
      <button data-view="intel">Intelligence</button>
      <button data-view="risk">Risk</button>
      <button data-view="documents">Documents</button>
      <button data-view="tasks">Tasks <b id="tc"></b></button>
      <button data-view="filings">Filings</button>
    </nav>
    <div class="top-r"><span class="mon"><i></i><span id="mon"></span></span><button class="reset" id="reset" type="button">Reset demo</button><a class="back" href="index.html" target="_top">Website</a><button class="btn pri" id="open-inbox" type="button">Process message</button></div>
  </header>
  <main id="main"></main>

  <aside class="inbox" id="inbox" hidden aria-label="Process an incoming message">
    <div class="in-h"><h2>Incoming message</h2><button class="x" id="close-inbox" type="button" aria-label="Close">✕</button></div>
    <p class="hint">Paste an email or note. BESSMIND finds the project, works out what changed, shifts the timeline and updates the risk model. This demo uses rules; the full product uses AI.</p>
    <div class="samples"><button type="button" data-sample="0">Grid operator email</button><button type="button" data-sample="1">Permit condition</button><button type="button" data-sample="2">Supplier quote</button></div>
    <label for="psel">Project</label><select id="psel"></select>
    <label for="msg">Message</label><textarea id="msg" rows="9" placeholder="Paste an email here"></textarea>
    <button class="btn pri wide" id="analyze" type="button">Analyze message</button>
    <ol class="pipe" id="pipe"></ol>
    <div id="result" aria-live="polite"></div>
  </aside>
</div>
<div class="drawer" id="drawer" hidden></div>
<div class="pop" id="pop" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
