<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BESSMIND — Live demo</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="logo" viewBox="0 0 32 32"><rect x="2" y="5" width="25" height="22" rx="5" fill="none" stroke="currentColor" stroke-width="2.2"/><rect x="28" y="13" width="3" height="6" rx="1.5" fill="currentColor"/><path d="M8 23V17M13 23V12M18 23V15M23 23V10" stroke="#169d76" stroke-width="2" stroke-linecap="round"/><polyline points="8,17 13,12 18,15 23,10" fill="none" stroke="#1688bd" stroke-width="1.4"/><g fill="#1688bd"><circle cx="8" cy="17" r="1.7"/><circle cx="13" cy="12" r="1.7"/><circle cx="18" cy="15" r="1.7"/><circle cx="23" cy="10" r="1.7"/></g></symbol></svg>

<div class="shell">
  <aside class="side">
    <a class="brand" href="index.html" target="_top"><svg class="logo"><use href="#logo"/></svg><span>BESS<em>MIND</em></span></a>
    <nav id="nav">
      <button data-view="portfolio" class="on">▣ <span>Portfolio</span></button>
      <button data-view="tasks">✓ <span>Tasks</span> <b id="tc"></b></button>
      <button data-view="documents">▤ <span>Documents</span></button>
      <button data-view="filings">☑ <span>Filings</span></button>
    </nav>
    <div class="side-foot"><small>Sample workspace</small><b>Nordwind Development</b><a class="back" href="index.html" target="_top">← Back to website</a><button class="reset" id="reset" type="button">Reset demo data</button></div>
  </aside>

  <section class="content">
    <header class="bar"><h1 id="title">Portfolio</h1><button class="cta" id="open-inbox" type="button">＋ Incoming message</button></header>
    <main id="main"></main>
  </section>

  <aside class="inbox" id="inbox" hidden aria-label="Process an incoming message">
    <div class="in-h"><h2>Incoming message</h2><button class="x" id="close-inbox" type="button" aria-label="Close">✕</button></div>
    <p class="hint">Paste an email or note. BESSMIND finds the project, works out what changed, and updates the model. <i>This demo uses rules; the full product uses AI.</i></p>
    <div class="samples"><button type="button" data-sample="0">Grid operator email</button><button type="button" data-sample="1">Permit condition</button><button type="button" data-sample="2">Supplier quote</button></div>
    <label for="psel">Project</label><select id="psel"></select>
    <label for="msg">Message</label><textarea id="msg" rows="9" placeholder="Paste an email here…"></textarea>
    <button class="cta wide" id="analyze" type="button">Analyze message</button>
    <ol class="pipe" id="pipe"></ol>
    <div id="result" aria-live="polite"></div>
  </aside>
</div>
<div class="drawer" id="drawer" hidden></div>
<div class="pop" id="pop" hidden></div>
<script src="app.js"></script>
</body>
</html>
